name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 5"
      timezone: "Europe/Stockholm"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Refresh every catalog deck
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: bun run refresh:decks
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build and verify static site
        run: bun run build
        env:
          GITHUB_PAGES: "true"
      - name: Save verified deck snapshots
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add src/data/moxfield-seeds.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh all catalog deck snapshots"
            git push origin "HEAD:$TARGET_BRANCH"
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
